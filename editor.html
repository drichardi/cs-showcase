<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Editor — Punahou CS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .ed{display:grid;grid-template-columns:1fr 380px;gap:26px;align-items:start}
  @media(max-width:1000px){.ed{grid-template-columns:1fr}}
  .card{border:1px solid var(--hair);border-radius:12px;background:var(--panel);margin-bottom:14px;overflow:hidden}
  .card > summary{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none}
  .card > summary::-webkit-details-marker{display:none}
  .card > summary .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .card > summary .sl{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);margin-left:auto;text-transform:lowercase;letter-spacing:.04em}
  .card .inner{padding:4px 18px 20px;border-top:1px solid var(--hair)}
  .f{margin-bottom:14px}
  .f label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
  .f input[type=text],.f input[type=number],.f textarea,.f select{
    width:100%;background:var(--panel-2);color:var(--ink);border:1px solid var(--hair);
    border-radius:8px;padding:9px 11px;font:inherit;font-size:.9rem}
  .f textarea{min-height:76px;resize:vertical;line-height:1.5}
  .f .hint{font-size:.74rem;color:var(--ink-3);margin-top:4px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .checks{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;align-items:center}
  .checks label{display:inline-flex;gap:6px;align-items:center;font-family:var(--body);font-size:.86rem;
    text-transform:none;letter-spacing:0;color:var(--ink-2);margin:0}
  .prq{border:1px dashed var(--hair-2);border-radius:10px;padding:12px;margin-bottom:10px}
  .prq .top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .prq .top select{flex:1}
  .mini{font-size:.76rem;padding:5px 10px;border-radius:999px;border:1px solid var(--hair-2);color:var(--ink-2)}
  .mini:hover{border-color:var(--t1);color:var(--t1)}
  .mini.danger:hover{border-color:var(--cap);color:var(--cap)}
  .out{position:sticky;top:78px}
  .out pre{background:var(--panel-2);border:1px solid var(--hair);border-radius:12px;padding:14px;
    max-height:52vh;overflow:auto;font-family:var(--mono);font-size:.72rem;line-height:1.5;color:var(--ink-2);margin:0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .warnbox{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);
    padding:11px 14px;border-radius:0 8px 8px 0;font-size:.82rem;color:var(--ink-2);margin-bottom:12px}
  .ok{color:var(--cyb)}
</style>
<script src="assets/js/shared.js"></script>
</head>
<body>
<svg id="topo" aria-hidden="true"></svg>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span> Course Editor</a>
    <nav>
      <a href="index.html">View site</a>
      <span class="ctl"></span>
    </nav>
  </div>
</header>

<div class="fb">
  <div class="wrap">
    <b>Reviewing three designs.</b> Same site, three visual directions — switch and tell us which reads best.
    <span class="pick"></span>
  </div>
</div>

<main>
  <section style="padding-top:34px">
    <div class="wrap">
      <div class="sec-head"><div>
        <h2>Course editor</h2>
        <p>Edit the catalog without touching JSON by hand. Download the result and commit it as <code>data/courses.json</code>.</p>
      </div></div>

      <div class="ed">
        <div>
          <div class="bar">
            <button class="mini" id="addCourse">+ Add course</button>
            <button class="mini" id="loadFile">Open a courses.json…</button>
            <input type="file" id="fileIn" accept="application/json" hidden>
            <button class="mini" id="expandAll">Expand all</button>
            <button class="mini" id="collapseAll">Collapse all</button>
          </div>
          <div id="courses"></div>
        </div>

        <div class="out">
          <div class="bar">
            <button class="btn btn-primary" id="dl" style="padding:10px 18px;font-size:.86rem">Download courses.json</button>
            <button class="mini" id="copy">Copy</button>
          </div>
          <div id="issues"></div>
          <pre id="preview"></pre>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/editor.js"></script>
</body>
</html>
